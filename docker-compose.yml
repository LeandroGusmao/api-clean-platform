services:
  postgres:
    # Pinned exact — bump deliberately, same convention as our npm deps.
    image: postgres:18.4-alpine3.24
    container_name: api-clean-platform-postgres
    restart: unless-stopped
    # Bind to localhost only — never expose the dev DB to the LAN.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: api_clean_platform
      POSTGRES_PASSWORD: api_clean_platform_local_dev
      POSTGRES_DB: api_clean_platform
    # Avoids "could not resize shared memory" on larger queries.
    shm_size: 256mb
    # PG18+ expects a single mount at /var/lib/postgresql (data goes in a
    # versioned subdirectory), keeping future `pg_upgrade --link` clean.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U api_clean_platform -d api_clean_platform']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Ephemeral database for the integration suite (`pnpm test:integration`).
  # Separate service rather than a second database on the dev instance: the
  # suite can never touch development data, and `tmpfs` keeps the whole cluster
  # in RAM, so restarting the container is the reset — no truncate needed.
  postgres-test:
    # Pinned exact — bump deliberately, same convention as our npm deps.
    image: postgres:18.4-alpine3.24
    container_name: api-clean-platform-postgres-test
    restart: unless-stopped
    # Bind to localhost only, on its own port so it never shadows the dev DB.
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: api_clean_platform
      POSTGRES_PASSWORD: api_clean_platform_local_dev
      POSTGRES_DB: api_clean_platform_test
    shm_size: 256mb
    # Data in RAM: faster, and discarded when the container stops. No volume.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U api_clean_platform -d api_clean_platform_test']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backs the rate limit of every route that declares its own ceiling. A counter
  # lives for one window, so nothing here is worth keeping: no snapshots, no
  # volume, and a restart is a clean slate.
  redis:
    # Pinned exact — bump deliberately, same convention as our npm deps.
    image: redis:8.10.1-alpine3.23
    container_name: api-clean-platform-redis
    restart: unless-stopped
    # Bind to localhost only — never expose the dev Redis to the LAN.
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Ephemeral Redis for the integration suite, on its own port so it never shares
  # counters with the dev instance: the suite flushes it freely.
  redis-test:
    # Pinned exact — bump deliberately, same convention as our npm deps.
    image: redis:8.10.1-alpine3.23
    container_name: api-clean-platform-redis-test
    restart: unless-stopped
    ports:
      - '127.0.0.1:6380:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Local SMTP catcher. Captures every outgoing message — verification codes
  # included — instead of delivering it, and exposes an HTTP API the integration
  # suite reads the code back from. The same SmtpEmailSender adapter talks to
  # this in development and to a real provider in production; only the
  # environment differs.
  mailpit:
    # Pinned exact — bump deliberately, same convention as our npm deps.
    image: axllent/mailpit:v1.30.2
    container_name: api-clean-platform-mailpit
    restart: unless-stopped
    # Bind to localhost only — never expose the dev mail UI or SMTP to the LAN.
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
